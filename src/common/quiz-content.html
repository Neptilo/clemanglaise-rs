  <details id="tag-filter" aria-label="{{Filter by tags}}">
    <summary>{{Filter by tags}}</summary>
    <div id="tag-filter-options" role="group" aria-label="{{Filter by tags}}"></div>
  </details>
  <p>{{Translate: }}<b class="word"></b> {{into}} <span id="target-language"></span>.</p>
  <p><em id="hint"></em></p>
  <div id="input-row">
    <input type="text" id="input" required>
    <button class="ok-button" id="validate-question-button">{{OK}}</button>
  </div>
  <div id="answer" hidden>
    <h2 id="meaning"></h2>
    <p id="message"></p>
    <p>
      <b class="word"></b><em id="part-of-speech"></em>:<b id="pronunciation"></b>
    </p>
    <p><em id="comment"></em></p>
    <p><em id="example"></em></p>
    <button class="ok-button" id="validate-answer-button">{{OK}}</button>
  </div>
