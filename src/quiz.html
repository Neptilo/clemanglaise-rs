<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clemanglaise</title>
  <link rel="stylesheet" href="clemanglaise.css">
</head>
<body>
  <!-- Login corner in top-right -->
  <div id="login-corner"></div>
  <main id="quiz-content"></main>
  <script src="auth/client.js"></script>
  <script src="auth/session.js"></script>
  <script src="auth/ui/login-modal.js"></script>
  <script src="auth/ui/login-corner.js"></script>
  <script>
    fetch('common/quiz-content.html')
      .then(response => response.text())
      .then(html => {
        html = html.replace(/\{\{(.*?)\}\}/g, '$1');
        document.getElementById('quiz-content').innerHTML = html;
        // quiz.js loads the shared modules and the tag filter, then starts the
        // quiz, so the filter must not be loaded here as well.
        const quizScript = document.createElement('script');
        quizScript.src = 'quiz.js';
        document.body.appendChild(quizScript);
      })
      .catch(error => console.error('Error loading quiz content:', error));
  </script>
</body>
</html>
